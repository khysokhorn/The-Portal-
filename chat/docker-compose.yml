version: '3.8'

services:
  claude-proxy:
    build: .
    container_name: claude-proxy
    ports:
      - "4000:4000"
    env_file:
      - .env
    extra_hosts:

      - "host.docker.internal:host-gateway"
    volumes:
      - /Users/sokhorn/.antigravity_tools:/root/.antigravity_tools
      - /Users/sokhorn/Library/Application Support/Antigravity:/root/DesktopAppSupport/Antigravity
    restart: unless-stopped